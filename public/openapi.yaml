openapi: 3.0.3
info:
  title: IC Dashboard API
  description: |
    API specification for the Yuanta IC Agent Portal dashboard.
    Covers client data, NBA actions, pipeline deals, and kanban board.
  version: 1.0.0
  contact:
    name: Yuanta Dev Team

servers:
  - url: http://localhost:3000/api/mock
    description: Local development (mock)
  - url: /api/mock
    description: Production (mock)

tags:
  - name: Clients
    description: Wealth management client profiles
  - name: NBA Actions
    description: Next Best Action recommendations generated by AI
  - name: Pipeline Deals
    description: Sales pipeline and deal tracking
  - name: Mini Kanban
    description: Simplified kanban board for deal stages
  - name: KYC
    description: Know-Your-Customer compliance records per client
  - name: Client Allocations
    description: Per-client asset-class allocation used by the Client Hub
  - name: Product Holdings
    description: >
      Asset classes aggregated across all clients (Client Hub "Product" view).
      Currently derived on the client from allocations; expose as a server-side
      aggregation to move the computation off the browser.

paths:
  /clients:
    get:
      tags: [Clients]
      summary: List all clients
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientList'
    post:
      tags: [Clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSingle'
        '400':
          $ref: '#/components/responses/BadRequest'

  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get a single client
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Client detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      summary: Update a client
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clients]
      summary: Delete a client
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Client deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /nba-actions:
    get:
      tags: [NBA Actions]
      summary: List all NBA actions
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of NBA actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NBAActionList'
    post:
      tags: [NBA Actions]
      summary: Create a new NBA action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NBAActionInput'
      responses:
        '201':
          description: NBA action created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NBAActionSingle'
        '400':
          $ref: '#/components/responses/BadRequest'

  /nba-actions/{id}:
    get:
      tags: [NBA Actions]
      summary: Get a single NBA action
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: NBA action detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NBAActionSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [NBA Actions]
      summary: Update an NBA action
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NBAActionInput'
      responses:
        '200':
          description: NBA action updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NBAActionSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [NBA Actions]
      summary: Delete an NBA action
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: NBA action deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /pipeline-deals:
    get:
      tags: [Pipeline Deals]
      summary: List all pipeline deals
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of pipeline deals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDealList'
    post:
      tags: [Pipeline Deals]
      summary: Create a new pipeline deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineDealInput'
      responses:
        '201':
          description: Pipeline deal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDealSingle'
        '400':
          $ref: '#/components/responses/BadRequest'

  /pipeline-deals/{id}:
    get:
      tags: [Pipeline Deals]
      summary: Get a single pipeline deal
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pipeline deal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDealSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pipeline Deals]
      summary: Update a pipeline deal
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineDealInput'
      responses:
        '200':
          description: Pipeline deal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineDealSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pipeline Deals]
      summary: Delete a pipeline deal
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Pipeline deal deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /mini-kanbans:
    get:
      tags: [Mini Kanban]
      summary: List all kanban items
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of kanban items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniKanbanList'
    post:
      tags: [Mini Kanban]
      summary: Create a new kanban item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniKanbanInput'
      responses:
        '201':
          description: Kanban item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniKanbanSingle'
        '400':
          $ref: '#/components/responses/BadRequest'

  /mini-kanbans/{id}:
    get:
      tags: [Mini Kanban]
      summary: Get a single kanban item
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Kanban item detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniKanbanSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Mini Kanban]
      summary: Update a kanban item
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiniKanbanInput'
      responses:
        '200':
          description: Kanban item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiniKanbanSingle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Mini Kanban]
      summary: Delete a kanban item
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Kanban item deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /kyc-data:
    get:
      tags: [KYC]
      summary: List KYC records
      description: >
        Drives the "KYC ครบกำหนด" summary card on the Client Hub. The UI flags
        clients whose daysUntilExpiry is under 30.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: List of KYC records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCRecordList'

  /kyc-data/{id}:
    get:
      tags: [KYC]
      summary: Get a single KYC record
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: KYC record detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCRecordSingle'
        '404':
          $ref: '#/components/responses/NotFound'

  /client-allocations/{clientId}:
    get:
      tags: [Client Allocations]
      summary: Get a client's asset-class allocation
      description: >
        Percentage split of a client's portfolio by asset class. The Client Hub
        table multiplies each slice percent by the client's AUM to show the THB
        held per asset class — return those amounts directly if available.
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Client allocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAllocationSingle'
        '404':
          $ref: '#/components/responses/NotFound'

  /product-holdings:
    get:
      tags: [Product Holdings]
      summary: List asset classes aggregated across all clients
      description: >
        The Client Hub "Product" view. Each row is an asset class with the number
        of holders, total THB, average allocation, and the per-client holders.
        Today this is computed in the browser (see buildProductRows in
        client-hub-data.ts); a server-side aggregation is preferred.
      responses:
        '200':
          description: List of product-holding rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRowList'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: "1"
    PageSize:
      name: pagination[pageSize]
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100
    Page:
      name: pagination[page]
      in: query
      schema:
        type: integer
        default: 1

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status: { type: integer, example: 404 }
                  message: { type: string, example: Not Found }
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status: { type: integer, example: 400 }
                  message: { type: string, example: Bad Request }

  schemas:
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 25 }
        pageCount: { type: integer, example: 1 }
        total: { type: integer, example: 8 }

    # ── Client ────────────────────────────────────────────────────────────────

    Client:
      type: object
      required: [id, name, tier, aum, cashIdlePct, plYtd, aiScore, status, lastContact, riskProfile]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Somchai Rattanakul
        tier:
          type: string
          enum: [UHNW, HNW]
          example: UHNW
        aum:
          type: number
          description: Assets under management in millions THB (e.g., 450 = ฿450M)
          example: 450
        cashIdlePct:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of portfolio sitting as idle cash
          example: 18
        plYtd:
          type: number
          description: Year-to-date P&L as percentage (e.g., 12.4 = +12.4%, -3.1 = -3.1%)
          example: 12.4
        aiScore:
          type: integer
          minimum: 0
          maximum: 100
          description: AI engagement/opportunity score
          example: 94
        status:
          type: string
          enum: [success, error, hold, processing]
          description: >
            Client portfolio health status:
            success = healthy, error = urgent action needed,
            hold = needs attention, processing = in progress
          example: success
        lastContact:
          type: string
          format: date
          description: Date of last contact in ISO 8601 format (YYYY-MM-DD)
          example: "2026-06-16"
        riskProfile:
          type: string
          enum: [Aggressive, Moderate, Conservative]
          example: Aggressive

    ClientList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    ClientSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Client'

    # ── NBA Action ────────────────────────────────────────────────────────────

    NBAAction:
      type: object
      required: [id, clientId, tier, priority, priorityVariant, insight, aiDraft, action, revenueImpact]
      properties:
        id:
          type: integer
          example: 1
        clientId:
          type: string
          description: References the id field of the Client resource
          example: "1"
        tier:
          type: string
          enum: [UHNW, HNW]
          example: UHNW
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          example: HIGH
        priorityVariant:
          type: string
          enum: [red, yellow, blue]
          description: UI color variant matching priority level
          example: red
        insight:
          type: string
          description: AI-generated insight explaining why this action is recommended
          example: "฿ 81M idle cash (18% of portfolio) — underperforming by 220bps vs target allocation."
        aiDraft:
          type: string
          description: AI-drafted message ready to send to the client (Thai language)
          example: "คุณสมชาย สวัสดีครับ ผมสังเกตว่าพอร์ตของคุณมีเงินสด 18%..."
        action:
          type: string
          description: Recommended action label for the RM
          example: "Review & Send"
        revenueImpact:
          type: string
          description: Estimated revenue impact or compliance label
          example: "฿ 2.4M est. revenue"

    NBAActionList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NBAAction'
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    NBAActionSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NBAAction'

    # ── Pipeline Deal ─────────────────────────────────────────────────────────

    PipelineDeal:
      type: object
      required: [id, clientId, product, dealSize, probability, stage, daysInStage, stalled]
      properties:
        id:
          type: integer
          example: 1
        clientId:
          type: string
          description: References the id field of the Client resource
          example: "1"
        product:
          type: string
          example: Structured Note
        dealSize:
          type: number
          description: Deal size in millions THB (e.g., 50 = ฿50M)
          example: 50
        probability:
          type: integer
          minimum: 0
          maximum: 100
          description: Win probability percentage
          example: 85
        stage:
          type: string
          enum: [Qualified, Proposed, Under Review, Negotiation, Closed Won, Closed Lost]
          example: Proposed
        daysInStage:
          type: integer
          minimum: 0
          description: Number of days the deal has been in the current stage
          example: 5
        stalled:
          type: boolean
          description: True if deal has been in the same stage for too long
          example: false

    PipelineDealList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PipelineDeal'
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    PipelineDealSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PipelineDeal'

    # ── Mini Kanban ───────────────────────────────────────────────────────────

    MiniKanban:
      type: object
      required: [id, clientId, dealName, dealSize, stage]
      properties:
        id:
          type: integer
          example: 1
        clientId:
          type: string
          description: References the id field of the Client resource
          example: "1"
        dealName:
          type: string
          example: "Structured Note"
        dealSize:
          type: number
          description: Deal size in millions THB (e.g., 50 = ฿50M)
          example: 50
        stage:
          type: string
          enum: [Idea, Pitch, Client Review, Executed]
          example: Pitch

    MiniKanbanList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MiniKanban'
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    MiniKanbanSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MiniKanban'

    # ── KYC ───────────────────────────────────────────────────────────────────

    KYCRecord:
      type: object
      required: [id, clientId, riskRating, kycStatus, nextReview, daysUntilExpiry]
      properties:
        id:
          type: integer
          example: 1
        clientId:
          type: string
          description: References the id field of the Client resource
          example: "1"
        riskRating:
          type: string
          example: Aggressive
        kycStatus:
          type: string
          enum: [success, error, hold, processing]
          description: success = valid, error = expired, hold = review due, processing = in progress
          example: success
        nextReview:
          type: string
          description: Next review date label (as displayed)
          example: "15 ก.ค. 2026"
        daysUntilExpiry:
          type: integer
          description: Days until KYC expires; the UI flags anything under 30
          example: 12

    KYCRecordList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/KYCRecord'
        meta:
          type: object
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'

    KYCRecordSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/KYCRecord'

    # ── Client Allocations ─────────────────────────────────────────────────────

    AssetAllocationSlice:
      type: object
      required: [label, percent, statusIcon]
      properties:
        label:
          type: string
          description: Asset-class name (Thai), e.g. หุ้นไทย, กองทุนรวม, เงินสด
          example: หุ้นไทย
        percent:
          type: number
          description: Share of the client's portfolio in this asset class (0–100)
          example: 20
        statusIcon:
          type: string
          description: Icon path used to colour the slice
          example: /asset-allocation/status-1.svg

    ClientAllocation:
      type: object
      required: [clientId, slices]
      properties:
        clientId:
          type: string
          example: "1"
        slices:
          type: array
          items:
            $ref: '#/components/schemas/AssetAllocationSlice'

    ClientAllocationSingle:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ClientAllocation'

    # ── Product Holdings (aggregated) ──────────────────────────────────────────

    ProductHolder:
      type: object
      required: [clientId, clientName, tier, allocationPct, amountThb]
      properties:
        clientId:
          type: string
          example: "1"
        clientName:
          type: string
          example: Somchai Rattanakul
        tier:
          type: string
          enum: [UHNW, HNW]
          example: UHNW
        allocationPct:
          type: number
          description: This client's allocation to the product (0–100)
          example: 20
        amountThb:
          type: number
          description: Absolute amount held in THB (AUM × allocationPct / 100)
          example: 90000000

    ProductRow:
      type: object
      required: [label, statusIcon, clientCount, totalAmountThb, avgAllocationPct, holders]
      properties:
        label:
          type: string
          description: Asset-class name (Thai)
          example: หุ้นไทย
        statusIcon:
          type: string
          example: /asset-allocation/status-1.svg
        clientCount:
          type: integer
          example: 6
        totalAmountThb:
          type: number
          description: Sum of holders' amountThb
          example: 540000000
        avgAllocationPct:
          type: number
          description: Mean allocationPct across holders
          example: 18.5
        holders:
          type: array
          items:
            $ref: '#/components/schemas/ProductHolder'

    ProductRowList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductRow'

    # ── Input schemas (POST / PUT request bodies — no id field) ──────────────

    ClientInput:
      type: object
      required: [name, tier, aum, cashIdlePct, plYtd, aiScore, status, lastContact, riskProfile]
      properties:
        name:          { type: string, example: Somchai Rattanakul }
        tier:          { type: string, enum: [UHNW, HNW] }
        aum:           { type: number, example: 450, description: "Value in millions THB (e.g., 450 = ฿450M)" }
        cashIdlePct:   { type: integer, minimum: 0, maximum: 100, example: 18 }
        plYtd:         { type: number, example: -3.1, description: "YTD P&L percentage — use - for loss (e.g., -3.1), no sign for gain (e.g., 12.4)" }
        aiScore:       { type: integer, minimum: 0, maximum: 100, example: 94 }
        status:        { type: string, enum: [success, error, hold, processing] }
        lastContact:   { type: string, format: date, example: "2026-06-16" }
        riskProfile:   { type: string, enum: [Aggressive, Moderate, Conservative] }

    NBAActionInput:
      type: object
      required: [clientId, tier, priority, priorityVariant, insight, aiDraft, action, revenueImpact]
      properties:
        clientId:
          type: string
          example: "1"
          description: "ID ของ Client ที่เชื่อมโยง"
        tier:
          type: string
          enum: [UHNW, HNW]
          description: "UHNW = Ultra High Net Worth, HNW = High Net Worth"
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: "HIGH = เร่งด่วน, MEDIUM = ปานกลาง, LOW = ทั่วไป"
        priorityVariant:
          type: string
          enum: [red, yellow, blue]
          description: "สีของ priority badge: red = HIGH, yellow = MEDIUM, blue = LOW"
        insight:
          type: string
          example: "Client มีเงินสดค้างอยู่ 18% ควรพิจารณาลงทุนเพิ่ม"
          description: "ข้อมูลเชิงลึกที่ AI วิเคราะห์ได้"
        aiDraft:
          type: string
          example: "สวัสดีคุณลูกค้า ทางเราอยากแนะนำผลิตภัณฑ์ใหม่..."
          description: "ร่างข้อความที่ AI สร้างสำหรับ NBA นี้"
        action:
          type: string
          example: "Review & Send"
          description: "การดำเนินการที่แนะนำ เช่น Review & Send, Call Client"
        revenueImpact:
          type: string
          example: "฿ 2.4M est. revenue"
